<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        if (window.location.pathname.endsWith('index.html')) {
            window.location.replace(window.location.pathname.replace(/index\.html$/, '') + window.location.search + window.location.hash);
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock's Script</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co.com/XZJcwxzw/0f94800fa0049e5dad9ebc027bd54e3c.jpg">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
    <style>
        :root {
            --bg-primary: #000000;
            --bg-secondary: #0a0a0a;
            --surface: #050505;
            --surface-hover: #111111;
            --color-primary: #eab308;
            --color-primary-hover: #ca8a04;
            --color-primary-dim: rgba(234, 179, 8, 0.1);
            --color-border: #1a1a1a;
            --color-text: #ffffff;
            --color-text-muted: #a0a0a0;
            --color-danger: #ef4444;
            --color-danger-hover: #dc2626;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.5);
            --shadow-md: 0 4px 12px rgba(234, 179, 8, 0.08);
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-primary); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--color-primary); cursor: pointer; }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg-primary);
            color: var(--color-text);
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }

        :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
        *:focus:not(:focus-visible) { outline: none; }
        img, picture, video, canvas, svg { display: block; max-width: 100%; }
        input, button, textarea, select { font: inherit; }

        .btn[disabled], .input-field:disabled { opacity: 0.5; cursor: not-allowed; }

        .navbar {
            position: fixed; top: 0; width: 100%; height: 64px;
            background: rgba(0,0,0,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--color-border); z-index: 1000;
        }

        .nav-content {
            max-width: 1400px; margin: 0 auto; height: 100%; padding: 0 32px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .brand { display: flex; align-items: center; gap: 12px; cursor: pointer; background: none; border: none; padding: 0; }
        .brand:hover { opacity: 0.8; }
        .nav-icon { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
        .nav-title { font-weight: 700; font-size: 18px; color: #ffffff; }

        .nav-center { flex: 1; display: flex; justify-content: center; padding: 0 32px; }
        .search-wrapper { position: relative; width: 100%; max-width: 520px; }
        .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); pointer-events: none; }

        #search {
            width: 100%; background: var(--surface); border: 1px solid var(--color-border);
            color: var(--color-text); padding: 11px 20px 11px 44px; border-radius: 12px; font-size: 14px; transition: all 0.2s ease;
        }
        #search:focus { border-color: var(--color-primary); background: var(--bg-secondary); box-shadow: 0 0 0 3px var(--color-primary-dim); }

        .container { max-width: 1400px; margin: 84px auto 40px; padding: 0 32px; min-height: calc(100vh - 124px); }
        .content-wrapper { display: grid; grid-template-columns: 260px 1fr; gap: 48px; }
        .sidebar { position: sticky; top: 100px; height: fit-content; }

        .sidebar-link {
            display: flex; align-items: center; gap: 10px; padding: 11px 14px;
            color: var(--color-text-muted); text-decoration: none; font-size: 14px; font-weight: 600;
            border-radius: 10px; margin-bottom: 6px; transition: all 0.2s ease;
        }
        .sidebar-link:hover { color: var(--color-text); background: var(--surface); }
        .sidebar-link.active { color: var(--color-primary); background: var(--color-primary-dim); }

        .sidebar-sort {
            width: 100%; padding: 11px 14px; color: var(--color-text-muted); background: transparent;
            border: none; border-radius: 10px; font-family: inherit; font-size: 14px; font-weight: 600; margin-bottom: 6px; cursor: pointer;
        }

        .script-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
        .script-card {
            background: var(--surface); border: 1px solid var(--color-border); border-radius: 16px; padding: 28px;
            cursor: pointer; transition: all 0.25s ease; display: flex; flex-direction: column; position: relative;
        }
        .script-card:hover { transform: translateY(-4px); border-color: var(--color-primary); box-shadow: 0 8px 24px rgba(234, 179, 8, 0.1); }
        .script-title { font-size: 16px; font-weight: 700; color: #fff; word-break: break-word; line-height: 1.4; }
        .card-description { color: var(--color-text-muted); font-size: 13px; margin: 10px 0; line-height: 1.5; }
        .card-meta { margin-top: auto; padding-top: 16px; font-size: 12px; color: var(--color-text-muted); border-top: 1px solid var(--color-border); }

        .badge { font-size: 10px; font-weight: 800; padding: 5px 10px; border-radius: 8px; text-transform: uppercase; }
        .badge-public { background: var(--color-primary); color: #000; }
        .badge-private { background: var(--surface-hover); color: var(--color-text-muted); border: 1px solid var(--color-border); }

        .code-box { background: var(--surface); border: 1px solid var(--color-border); border-radius: 16px; overflow: hidden; margin-top: 20px; }
        .toolbar { background: var(--bg-secondary); border-bottom: 1px solid var(--color-border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .toolbar-right { display: flex; gap: 10px; }
        pre { margin: 0; padding: 24px; overflow-x: auto; background: #000000 !important; }
        code { font-family: 'Courier New', monospace; font-size: 13px; color: #fff; }

        .admin-panel { max-width: 900px; margin: 0 auto; }
        .admin-header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; border-bottom: 1px solid var(--color-border); padding-bottom: 24px; }
        .tab-switcher { background: var(--bg-secondary); padding: 5px; border-radius: 12px; border: 1px solid var(--color-border); display: flex; gap: 4px; }
        .tab-btn { background: transparent; border: none; color: var(--color-text-muted); padding: 9px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13px; }
        .tab-btn.active { background: var(--surface); color: #fff; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: flex; align-items: center; justify-content: center; z-index: 2000; backdrop-filter: blur(8px); padding: 20px; }
        .modal { background: var(--surface); border: 1px solid var(--color-border); border-radius: 20px; width: 100%; max-width: 420px; padding: 32px; }
        .close-btn { background: none; border: none; color: var(--color-text-muted); font-size: 28px; cursor: pointer; }

        .editor-container { background: var(--surface); padding: 36px; border-radius: 16px; border: 1px solid var(--color-border); margin-top: 24px; }
        .form-group { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
        .form-group label { font-size: 12px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; }
        .input-field { width: 100%; padding: 12px 16px; background: var(--bg-secondary); border: 1px solid var(--color-border); color: #fff; border-radius: 10px; font-size: 14px; }
        .input-field:focus { border-color: var(--color-primary); box-shadow: 0 0 0 3px var(--color-primary-dim); }
        textarea.input-field { resize: vertical; min-height: 120px; }

        .CodeMirror { background: #000000 !important; border: 1px solid var(--color-border); border-radius: 10px; font-family: 'Courier New', monospace; height: 350px !important; color: #fff; }

        .btn { background: var(--color-primary); color: #000; border: none; padding: 11px 20px; border-radius: 10px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; transition: 0.2s; text-decoration: none; }
        .btn:hover { background: var(--color-primary-hover); }
        .btn-secondary { background: transparent; border: 1px solid var(--color-border); color: #fff; }
        .btn-secondary:hover { background: var(--surface); }
        .btn-delete { background: var(--color-danger); color: #fff; }
        .btn-tutorial { background: #ff0000; color: #fff; }
        .btn-tutorial:hover { background: #cc0000; }

        .admin-item { padding: 22px; background: var(--bg-secondary); border-radius: 14px; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--color-border); }
        .spinner { width: 32px; height: 32px; border: 3px solid var(--color-border); border-top-color: var(--color-primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 768px) {
            .content-wrapper { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .nav-content { padding: 0 16px; }
            .container { padding: 0 16px; }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <div class="nav-left">
                <button class="brand" onclick="app.navigate('')" style="background:none;border:none;padding:0;cursor:pointer">
                    <img src="https://i.ibb.co.com/XZJcwxzw/0f94800fa0049e5dad9ebc027bd54e3c.jpg" class="nav-icon" alt="Icon">
                    <span class="nav-title">Clock's Script</span>
                </button>
            </div>
            <div class="nav-center">
                <div class="search-wrapper">
                    <i class="search-icon">🔍</i>
                    <input type="text" id="search" placeholder="Search scripts..." oninput="app.handleSearch(this.value)">
                </div>
            </div>
            <div class="nav-right">
                <div id="auth-section">
                    <button class="btn btn-secondary btn-sm" onclick="app.toggleLoginModal()">Login</button>
                </div>
                <div id="user-section" style="display:none">
                    <button class="btn btn-primary btn-sm" onclick="app.navigate('admin')">Manage</button>
                </div>
            </div>
        </div>
    </nav>
    
    <div id="login-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this) app.toggleLoginModal()">
        <div class="modal">
            <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
                <h3 style="color:var(--color-primary)">Admin Login</h3>
                <button class="close-btn" onclick="app.toggleLoginModal()">×</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Admin Password</label>
                    <input type="password" id="auth-token" class="input-field" placeholder="Enter password..." onkeypress="if(event.key==='Enter') app.login()">
                </div>
                <div id="login-error" style="color:var(--color-danger);font-size:13px;margin:10px 0;display:none"></div>
                <button class="btn btn-full" style="width:100%" onclick="app.login()">Enter</button>
            </div>
        </div>
    </div>

    <div class="container">
        <!-- HOME VIEW -->
        <div id="view-home" class="view-section" style="display:block">
            <div class="content-wrapper">
                <aside class="sidebar">
                    <div class="sidebar-links">
                        <a href="#" class="sidebar-link active" onclick="event.preventDefault(); app.filterCategory('all', event)">🏠 All Scripts</a>
                        <a href="#" class="sidebar-link" onclick="event.preventDefault(); app.filterCategory('public', event)">🌐 Public</a>
                        <select id="sort-select" class="sidebar-sort" onchange="app.setSort(this.value)">
                            <option value="created">Newest</option>
                            <option value="az">Title A → Z</option>
                        </select>
                        <a href="#" class="sidebar-link" id="private-filter" style="display:none" onclick="event.preventDefault(); app.filterCategory('private', event)">🔒 Private</a>
                    </div>
                </aside>
                <main class="main-content">
                    <div class="script-grid" id="script-list">
                        <div style="text-align:center;padding:60px 0;grid-column:1/-1">
                            <div class="spinner"></div>
                            <p>Loading library from JSONBin...</p>
                        </div>
                    </div>
                </main>
            </div>
        </div>

        <!-- DETAIL VIEW -->
        <div id="view-detail" class="view-section" style="display:none">
            <button class="btn btn-secondary btn-sm" onclick="app.navigate('')" style="margin-bottom:20px;">← Back</button>
            <div id="script-detail-content"></div>
        </div>

        <!-- ADMIN VIEW -->
        <div id="view-admin" class="view-section" style="display:none">
            <div class="admin-panel">
                <div class="admin-header-flex">
                    <h2>Admin Panel</h2>
                    <div class="tab-switcher">
                        <button class="tab-btn active" onclick="app.switchAdminTab('list')">Manage</button>
                        <button class="tab-btn" onclick="app.switchAdminTab('create')">Add New</button>
                        <button class="tab-btn" onclick="app.logout()" style="color:var(--color-danger)">Logout</button>
                    </div>
                </div>

                <div id="admin-tab-editor" class="admin-tab" style="display:none">
                    <div class="editor-container">
                        <h3 id="editor-heading" style="margin-bottom:20px;">Create New Script</h3>
                        <input type="hidden" id="edit-id">
                        <div class="form-group">
                            <label>Script Title</label>
                            <input type="text" id="edit-title" class="input-field" placeholder="e.g. Advanced Hub">
                        </div>
                        <div class="form-group">
                            <label>Visibility</label>
                            <select id="edit-visibility" class="input-field">
                                <option value="PUBLIC">Public</option>
                                <option value="PRIVATE">Private</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="edit-desc" class="input-field" placeholder="Briefly describe your script..."></textarea>
                        </div>
                        <div class="form-group">
                            <label>Tutorial Video Link (YouTube / TikTok - Optional)</label>
                            <input type="text" id="edit-tutorial" class="input-field" placeholder="https://youtube.com/... or https://tiktok.com/...">
                        </div>
                        <div class="form-group">
                            <label>Lua Source</label>
                            <textarea id="edit-code" class="input-field"></textarea>
                        </div>
                        <div style="display:flex;gap:10px;justify-content:flex-end;">
                            <button class="btn btn-secondary" onclick="app.switchAdminTab('list')">Cancel</button>
                            <button class="btn" onclick="app.saveScript()">Publish to JSONBin</button>
                        </div>
                    </div>
                </div>

                <div id="admin-tab-list" class="admin-tab" style="display:block">
                    <div style="display:flex;justify-content:space-between;margin-bottom:20px;">
                        <h3>Existing Scripts</h3>
                        <span id="total-stats" style="color:var(--color-text-muted)">0 scripts</span>
                    </div>
                    <div id="admin-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/lua/lua.min.js"></script>
    <script>
        const JSONBIN_BIN_ID = "6af880d9ffd5d16053c13c87";
        const JSONBIN_MASTER_KEY = "$2a$10$7kUozSyzkNytbUxnN7/kv.xInV14ItUgvNAWdjKEswZ0M.DDWgL/e";
        const ADMIN_PASSWORD = "assassin";

        const app = {
            scripts: [],
            currentFilter: 'all',
            currentSort: 'created',
            isAdmin: localStorage.getItem('is_admin') === 'true',
            codeMirrorInstance: null,

            init() {
                this.checkAuthUI();
                this.loadScripts();
                window.addEventListener('hashchange', () => this.router());
                this.router();
            },

            toggleLoginModal() {
                const modal = document.getElementById('login-modal');
                modal.style.display = modal.style.display === 'none' ? 'flex' : 'none';
            },

            login() {
                const pass = document.getElementById('auth-token').value;
                if (pass === ADMIN_PASSWORD) {
                    this.isAdmin = true;
                    localStorage.setItem('is_admin', 'true');
                    this.toggleLoginModal();
                    this.checkAuthUI();
                    Toastify({ text: "Successfully logged in as Admin!", duration: 3000, style: { background: "#eab308", color: "#000" } }).showToast();
                    this.navigate('admin');
                } else {
                    document.getElementById('login-error').style.display = 'block';
                    document.getElementById('login-error').textContent = 'Incorrect password!';
                }
            },

            logout() {
                this.isAdmin = false;
                localStorage.removeItem('is_admin');
                this.checkAuthUI();
                this.navigate('');
                Toastify({ text: "Logged out successfully", duration: 2000 }).showToast();
            },

            checkAuthUI() {
                document.getElementById('auth-section').style.display = this.isAdmin ? 'none' : 'block';
                document.getElementById('user-section').style.display = this.isAdmin ? 'block' : 'none';
                const privateFilter = document.getElementById('private-filter');
                if (privateFilter) privateFilter.style.display = this.isAdmin ? 'flex' : 'none';
            },

            async loadScripts() {
                try {
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}/latest`, {
                        headers: {
                            "X-Master-Key": JSONBIN_MASTER_KEY
                        }
                    });
                    const result = await response.json();
                    if (result && result.record) {
                        this.scripts = Array.isArray(result.record) ? result.record : [];
                    } else {
                        this.scripts = [];
                    }
                    this.renderScripts();
                    this.renderAdminList();
                } catch (e) {
                    console.error("Failed to load from JSONBin:", e);
                    Toastify({ text: "Failed to connect to JSONBin cloud!", style: { background: "#ef4444", color: "#fff" } }).showToast();
                }
            },

            async saveToCloud() {
                try {
                    const response = await fetch(`https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json",
                            "X-Master-Key": JSONBIN_MASTER_KEY
                        },
                        body: JSON.stringify(this.scripts)
                    });
                    if (!response.ok) throw new Error("Failed to update cloud storage");
                } catch (e) {
                    console.error(e);
                    Toastify({ text: "Error saving changes to JSONBin cloud!", style: { background: "#ef4444", color: "#fff" } }).showToast();
                }
            },

            renderScripts() {
                const listEl = document.getElementById('script-list');
                let filtered = this.scripts.filter(s => {
                    if (this.currentFilter === 'public') return s.visibility === 'PUBLIC';
                    if (this.currentFilter === 'private') return s.visibility === 'PRIVATE';
                    return this.isAdmin || s.visibility === 'PUBLIC';
                });

                if (filtered.length === 0) {
                    listEl.innerHTML = `<div class="empty-state" style="grid-column:1/-1;text-align:center;padding:50px;"><h2>No scripts found</h2></div>`;
                    return;
                }

                listEl.innerHTML = filtered.map(s => `
                    <div class="script-card" onclick="app.viewDetail('${s.id}')">
                        <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
                            <span class="script-title">${s.title}</span>
                            <span class="badge badge-${s.visibility.toLowerCase()}">${s.visibility}</span>
                        </div>
                        <p class="card-description">${s.description || 'No description provided.'}</p>
                        <div class="card-meta">Created: ${new Date(s.created).toLocaleDateString()}</div>
                    </div>
                `).join('');
            },

            renderAdminList() {
                const adminList = document.getElementById('admin-list');
                document.getElementById('total-stats').textContent = `${this.scripts.length} total scripts`;
                
                adminList.innerHTML = this.scripts.map(s => `
                    <div class="admin-item">
                        <div>
                            <strong>${s.title}</strong>
                            <span style="font-size:12px;color:var(--color-text-muted)">${s.visibility}</span>
                        </div>
                        <div style="display:flex;gap:10px;">
                            <button class="btn btn-secondary btn-sm" onclick="app.editScript('${s.id}')">Edit</button>
                            <button class="btn btn-delete btn-sm" onclick="app.deleteScript('${s.id}')">Delete</button>
                        </div>
                    </div>
                `).join('');
            },

            viewDetail(id) {
                location.hash = `#script/${id}`;
            },

            navigate(view) {
                if (view === 'admin' && !this.isAdmin) {
                    this.toggleLoginModal();
                    return;
                }
                location.hash = view ? `#${view}` : '#';
            },

            router() {
                const hash = location.hash.slice(1);
                document.querySelectorAll('.view-section').forEach(el => el.style.display = 'none');

                if (hash.startsWith('script/')) {
                    document.getElementById('view-detail').style.display = 'block';
                    const id = hash.split('/')[1];
                    const script = this.scripts.find(s => s.id === id);
                    if (script) {
                        let tutorialBtnHtml = '';
                        if (script.tutorial && script.tutorial.trim() !== '') {
                            tutorialBtnHtml = `<a href="${script.tutorial}" target="_blank" class="btn btn-tutorial btn-sm">▶ Watch Tutorial</a>`;
                        }

                        document.getElementById('script-detail-content').innerHTML = `
                            <div style="margin-bottom:20px;">
                                <h1 style="font-size:32px;margin-bottom:10px;">${script.title}</h1>
                                <p style="color:var(--color-text-muted)">${script.description || ''}</p>
                            </div>
                            <div class="code-box">
                                <div class="toolbar">
                                    <span>Lua Script</span>
                                    <div class="toolbar-right">
                                        ${tutorialBtnHtml}
                                        <button class="btn btn-sm" onclick="navigator.clipboard.writeText(` + "`" + `${script.code}` + "`" + `); Toastify({text:'Copied to clipboard!'}).showToast()">Copy Code</button>
                                    </div>
                                </div>
                                <pre><code>${script.code}</code></pre>
                            </div>
                        `;
                    }
                } else if (hash === 'admin') {
                    if (!this.isAdmin) {
                        this.navigate('');
                        return;
                    }
                    document.getElementById('view-admin').style.display = 'block';
                    this.switchAdminTab('list');
                } else {
                    document.getElementById('view-home').style.display = 'block';
                }
            },

            switchAdminTab(tab) {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                if (tab === 'list') {
                    document.getElementById('admin-tab-list').style.display = 'block';
                    document.getElementById('admin-tab-editor').style.display = 'none';
                    this.renderAdminList();
                } else if (tab === 'create') {
                    document.getElementById('admin-tab-list').style.display = 'none';
                    document.getElementById('admin-tab-editor').style.display = 'block';
                    document.getElementById('editor-heading').textContent = 'Create New Script';
                    document.getElementById('edit-id').value = '';
                    document.getElementById('edit-title').value = '';
                    document.getElementById('edit-desc').value = '';
                    document.getElementById('edit-tutorial').value = '';
                    document.getElementById('edit-visibility').value = 'PUBLIC';
                    if (this.codeMirrorInstance) {
                        this.codeMirrorInstance.setValue('');
                    } else {
                        setTimeout(() => {
                            this.codeMirrorInstance = CodeMirror.fromTextArea(document.getElementById('edit-code'), {
                                mode: 'lua', theme: 'monokai', lineNumbers: true
                            });
                        }, 100);
                    }
                }
            },

            async saveScript() {
                if (!this.isAdmin) return;
                const id = document.getElementById('edit-id').value;
                const title = document.getElementById('edit-title').value.trim();
                const desc = document.getElementById('edit-desc').value.trim();
                const tutorial = document.getElementById('edit-tutorial').value.trim();
                const visibility = document.getElementById('edit-visibility').value;
                const code = this.codeMirrorInstance ? this.codeMirrorInstance.getValue() : document.getElementById('edit-code').value;

                if (!title) {
                    Swal.fire('Error', 'Script title is required!', 'error');
                    return;
                }

                if (id) {
                    const idx = this.scripts.findIndex(s => s.id === id);
                    if (idx !== -1) {
                        this.scripts[idx] = { ...this.scripts[idx], title, description: desc, tutorial, visibility, code };
                    }
                } else {
                    const newScript = {
                        id: Date.now().toString(),
                        title,
                        description: desc,
                        tutorial,
                        visibility,
                        code,
                        created: new Date().toISOString()
                    };
                    this.scripts.unshift(newScript);
                }

                await this.saveToCloud();
                Toastify({ text: "Script saved successfully to JSONBin!", background: "#eab308", color: "#000" }).showToast();
                this.switchAdminTab('list');
                this.renderScripts();
            },

            editScript(id) {
                const script = this.scripts.find(s => s.id === id);
                if (!script) return;
                this.switchAdminTab('create');
                document.getElementById('editor-heading').textContent = 'Edit Script';
                document.getElementById('edit-id').value = script.id;
                document.getElementById('edit-title').value = script.title;
                document.getElementById('edit-desc').value = script.description || '';
                document.getElementById('edit-tutorial').value = script.tutorial || '';
                document.getElementById('edit-visibility').value = script.visibility;
                if (this.codeMirrorInstance) {
                    this.codeMirrorInstance.setValue(script.code);
                }
            },

            async deleteScript(id) {
                Swal.fire({
                    title: 'Delete script?',
                    text: "This action cannot be undone!",
                    icon: 'warning',
                    showCancelButton: true,
                    confirmButtonText: 'Yes, delete!'
                }).then(async (result) => {
                    if (result.isConfirmed) {
                        this.scripts = this.scripts.filter(s => s.id !== id);
                        await this.saveToCloud();
                        this.renderAdminList();
                        this.renderScripts();
                        Toastify({ text: "Script deleted successfully" }).showToast();
                    }
                });
            },

            filterCategory(cat) {
                this.currentFilter = cat;
                document.querySelectorAll('.sidebar-link').forEach(l => l.classList.remove('active'));
                event.target.classList.add('active');
                this.renderScripts();
            },

            setSort(val) {
                this.currentSort = val;
                if (val === 'created') {
                    this.scripts.sort((a, b) => new Date(b.created) - new Date(a.created));
                } else if (val === 'az') {
                    this.scripts.sort((a, b) => a.title.localeCompare(b.title));
                }
                this.renderScripts();
            },

            handleSearch(query) {
                const listEl = document.getElementById('script-list');
                const q = query.toLowerCase();
                let filtered = this.scripts.filter(s => s.title.toLowerCase().includes(q) || (s.description && s.description.toLowerCase().includes(q)));
                
                if (filtered.length === 0) {
                    listEl.innerHTML = `<div class="empty-state" style="grid-column:1/-1;text-align:center;padding:50px;"><h2>No results found</h2></div>`;
                    return;
                }

                listEl.innerHTML = filtered.map(s => `
                    <div class="script-card" onclick="app.viewDetail('${s.id}')">
                        <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
                            <span class="script-title">${s.title}</span>
                            <span class="badge badge-${s.visibility.toLowerCase()}">${s.visibility}</span>
                        </div>
                        <p class="card-description">${s.description || 'No description provided.'}</p>
                        <div class="card-meta">Created: ${new Date(s.created).toLocaleDateString()}</div>
                    </div>
                `).join('');
            }
        };

        app.init();
    </script>
</body>
</html>
